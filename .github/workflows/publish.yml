name: Publish Nuget

on:
  release:
    types: [published]

jobs:
  publish:
    runs-on: ubuntu-latest

    permissions:
      id-token: write
      contents: read

    steps:
    
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .Net
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore BlazorLocalStorageManager.slnx

      - name: Build
        run: dotnet build BlazorLocalStorageManager.slnx -c Relase --no-restore

      - name: Pack
        run: dotnet pack BlazorLocalStorageManager.slnx -c Release --no-build

      - name: Publish
        run: dotnet nuget push "**/*.nupkg" \
          --source https://api.nuget.org/v3/index.json \
          --skip-duplicate
